schema_version: "1.0"
task_id: "TASK-DEMO-OPENCODE"
title: "Create an OpenCode smoke-test file"
type: "engineering"
goal: "Create agentbridge-opencode-smoke.txt in the workspace with one line: AgentBridge OpenCode smoke test passed. Do not change any other file."
source:
  adapter: "cli_manual"
target:
  executor_id: "opencode"
  capabilities_required: ["filesystem", "shell"]
  workspace: "."
scope:
  include: ["."]
  exclude: []
constraints:
  - "Only create agentbridge-opencode-smoke.txt."
acceptance:
  - id: "A1"
    type: "fileexists"
    path: "agentbridge-opencode-smoke.txt"
permissions:
  file_write: {mode: "allow"}
  delete: {mode: "allow"}
  network: {mode: "allow"}
  shell: {mode: "allow"}
budget:
  max_executor_rounds: 1
  max_retries_per_node: 0
  timeout_seconds: 600
stop:
  success: "The declared smoke-test file exists."
  blocked: "OpenCode, its provider, or an explicitly required permission is unavailable."
  no_progress: "The bounded executor round produced no new evidence."
  budget_exhausted: true
context_refs: []
