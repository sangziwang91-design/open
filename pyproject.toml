[project]
name = "sz-agentbridge"
version = "0.2.0"
description = "A model-agnostic, Chat-native control plane for personal agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9,<2",
  "build>=1.3,<2",
  "mypy>=2.3,<3",
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
agentbridge = "agentbridge.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
