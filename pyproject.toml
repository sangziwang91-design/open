[project]
name = "sz-agentbridge"
version = "0.4.0"
description = "An authenticated ChatGPT-web-to-OpenCode execution and evidence bridge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0,<3",
  "typer>=0.12,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9,<2",
  "build>=1.3,<2",
  "mypy>=2.3,<3",
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
agentbridge = "agentbridge.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
